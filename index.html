<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Fintech Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .fintech-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .binder-bar { width: 8px; cursor: pointer; transition: background 0.2s; }
        .row-profit { border-left: 8px solid #059669; }
        .row-loss { border-left: 8px solid #e11d48; }
        .text-profit { color: #059669; }
        .text-loss { color: #e11d48; }
        .bg-profit { background-color: #d1fae5; }
        .bg-loss { background-color: #fce7f3; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-xs">

    <!-- Top Bar -->
    <div class="bg-slate-900 text-slate-300 px-4 py-2 flex items-center justify-between text-[11px] border-b border-slate-800">
        <div class="font-bold uppercase tracking-wider text-emerald-400">Trading Journal Professional</div>
        <div id="ticker-container" class="flex gap-4"></div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col p-4 overflow-y-auto space-y-4">
            <div class="flex gap-2 border-b pb-2">
                <button onclick="switchTab('news')" class="px-3 py-1 font-bold text-emerald-600 bg-emerald-50 rounded">News</button>
                <button onclick="switchTab('calendar')" class="px-3 py-1 font-bold text-slate-600">Calendar</button>
            </div>
            <div id="sidebar-content" class="space-y-3"></div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-hidden">
            <div class="fintech-card p-5 grid grid-cols-12 gap-4">
                <div class="col-span-8 grid grid-cols-4 gap-2">
                    <div class="bg-slate-50 p-3 rounded-lg border text-center">
                        <div class="text-[10px] text-slate-500">Initial</div>
                        <input type="number" id="kpi-initial" onchange="updateInitialAsset(this.value)" class="w-full text-center bg-transparent font-bold">
                    </div>
                    <div class="col-span-2 bg-slate-900 text-white p-3 rounded-lg text-center">
                        <div class="text-[10px] text-slate-400">Total Net P&L</div>
                        <div id="kpi-net-pnl" class="text-xl font-black">+$0.00</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border text-center">
                        <div class="text-[10px] text-slate-500">Win Rate</div>
                        <div id="kpi-winrate" class="font-bold">0%</div>
                    </div>
                </div>
                <div class="col-span-4 bg-slate-50 p-3 rounded-lg border"><canvas id="pnl-canvas" class="w-full h-16"></canvas></div>
            </div>

            <div class="flex-1 overflow-auto bg-white rounded-lg border">
                <table class="w-full text-left"><tbody id="journal-tbody"></tbody></table>
            </div>
        </main>

        <!-- Inspector -->
        <aside class="w-96 bg-white border-l p-5 overflow-y-auto space-y-4">
            <div class="bg-slate-900 text-white p-4 rounded-xl text-[11px]" id="ai-advisor">
                <div class="font-bold text-emerald-400 mb-2">Gemini Trading Insight</div>
                <div id="ai-content">Click a trade to generate analysis.</div>
            </div>
            <div id="checkerboard-checklist-container" class="grid grid-cols-2 gap-2"></div>
            <div id="charts-gallery-container" class="grid grid-cols-2 gap-2"></div>
            <textarea id="review-notes" class="w-full p-2 border rounded text-xs" rows="3"></textarea>
        </aside>
    </div>

    <script>
        let monthsData = [{ name: "2026-07", initialAsset: 10000, trades: [{date: '2026-08-13', pair: 'BTC', pnl: 500, checklist: {}, charts: [], notes: ''}] }];
        let activeMonthIndex = 0; let selectedTradeIndex = 0;
        let checklistRules = ["Entry Model", "Reasonable RR Ratio", "Order Type"];
        let dropdownOptions = [{ label: "Confirmed", color: "green" }, { label: "Ignored", color: "pink" }];

        function switchTab(tab) {
            const container = document.getElementById('sidebar-content');
            if(tab === 'news') {
                container.innerHTML = `<div class="p-3 bg-slate-50 rounded text-[10px]"><b>Crypto News:</b> Bitcoin holds support.<br><br><b>Stocks:</b> Tech rally continues.</div>`;
            } else {
                container.innerHTML = `<a href="https://www.investing.com/economic-calendar/" target="_blank" class="block p-3 bg-emerald-50 text-emerald-800 font-bold text-center rounded">Investing.com Live Feed ↗</a>`;
            }
        }

        function generateAIStrategySuggestion() {
            const content = document.getElementById('ai-content');
            content.innerHTML = `
                <div class='mb-2'><b>1. Market Analysis:</b> Current volatility indicates a breakout potential in the BTC/USD pair.</div>
                <div class='mb-2'><b>2. Setup Evaluation:</b> Your entry models are well-aligned with the Daily POI zones. Continue prioritizing these.</div>
                <div><b>3. Risk Management:</b> Maintain a R:R of at least 1:2.5. Avoid exposure during high-impact news.</div>
            `;
        }

        function selectTrade(idx) {
            selectedTradeIndex = idx;
            const trade = monthsData[activeMonthIndex].trades[idx];
            document.getElementById('review-notes').value = trade.notes || '';
            renderCheckerboard();
            generateAIStrategySuggestion();
        }

        function renderCheckerboard() {
            const container = document.getElementById('checkerboard-checklist-container');
            container.innerHTML = '';
            const trade = monthsData[activeMonthIndex].trades[selectedTradeIndex];
            checklistRules.forEach(rule => {
                const val = trade.checklist[rule] || dropdownOptions[0].label;
                const opt = dropdownOptions.find(o => o.label === val);
                const bg = opt.color === 'green' ? 'bg-emerald-100 text-emerald-800' : 'bg-pink-100 text-pink-800';
                container.innerHTML += `<div class="p-2 border rounded ${bg}"><div class="font-bold text-[9px]">${rule}</div><select class="w-full text-[9px] bg-white/50">${dropdownOptions.map(o => `<option ${o.label === val ? 'selected' : ''}>${o.label}</option>`).join('')}</select></div>`;
            });
        }

        function renderJournal() {
            const tbody = document.getElementById('journal-tbody');
            tbody.innerHTML = monthsData[activeMonthIndex].trades.map((t, idx) => `
                <tr class="${t.pnl >= 0 ? 'row-profit' : 'row-loss'}" onclick="selectTrade(${idx})">
                    <td class="p-4 border-r w-8 font-bold text-slate-300">||</td>
                    <td class="p-2">${t.date}</td>
                    <td class="p-2">${t.pair}</td>
                    <td class="p-2 text-right ${t.pnl >= 0 ? 'text-profit' : 'text-loss'}">${t.pnl}</td>
                </tr>
            `).join('');
        }

        function renderAll() { renderJournal(); renderCheckerboard(); switchTab('news'); }
        renderAll();
    </script>
</body>
</html>
