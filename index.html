<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .fintech-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; }
        .binder-bar { width: 12px; cursor: pointer; transition: background 0.2s; }
        .row-profit { border-left: 12px solid #059669; }
        .row-loss { border-left: 12px solid #e11d48; }
        .status-green { background-color: #d1fae5; color: #065f46; }
        .status-pink { background-color: #fce7f3; color: #9d174d; }
        .status-gray { background-color: #f1f5f9; color: #475569; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-xs">

    <!-- Top Bar -->
    <div class="bg-slate-900 text-slate-300 px-4 py-2 flex items-center justify-between text-[11px] border-b border-slate-800">
        <div class="font-bold uppercase tracking-wider text-emerald-400">Trading Journal Professional</div>
        <div id="ticker-container" class="flex gap-4"></div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col p-4 overflow-y-auto space-y-4">
            <h2 class="font-extrabold text-slate-900 border-b pb-2">Live News & Summary</h2>
            <div id="news-container" class="space-y-4"></div>
            <div class="border-t pt-4">
                <a href="https://www.investing.com/economic-calendar/" target="_blank" class="block p-3 bg-blue-50 rounded-xl font-bold text-blue-800 text-center">Open Economic Calendar ↗</a>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-hidden">
            <div class="fintech-card p-5 grid grid-cols-12 gap-4">
                <div class="col-span-8 grid grid-cols-4 gap-2">
                    <div class="bg-slate-50 p-3 rounded-lg border text-center">
                        <div class="text-[10px] text-slate-500">Initial</div>
                        <input type="number" id="kpi-initial" onchange="updateInitialAsset(this.value)" class="w-full text-center bg-transparent font-bold">
                    </div>
                    <div class="col-span-2 bg-slate-900 text-white p-3 rounded-lg text-center">
                        <div class="text-[10px] text-slate-400">Total Net P&L</div>
                        <div id="kpi-net-pnl" class="text-xl font-black">+$0.00</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border text-center">
                        <div class="text-[10px] text-slate-500">Win Rate</div>
                        <div id="kpi-winrate" class="font-bold">0%</div>
                    </div>
                </div>
                <div class="col-span-4 bg-slate-50 p-3 rounded-lg border">
                    <canvas id="pnl-canvas" class="w-full h-16"></canvas>
                </div>
            </div>

            <div class="flex-1 overflow-auto bg-white rounded-lg border">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr><th class="p-2 w-12 text-center">Binder</th><th class="p-2">Date</th><th class="p-2">Pair</th><th class="p-2 text-right">Net PnL</th></tr>
                    </thead>
                    <tbody id="journal-tbody"></tbody>
                </table>
            </div>
        </main>

        <!-- Inspector Drawer -->
        <aside class="w-96 bg-white border-l p-5 overflow-y-auto space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm">Trade Details</h3>
                <button id="undo-btn" onclick="undoDelete()" class="text-xs bg-amber-500 text-white px-2 py-1 rounded hidden">Undo Last Delete</button>
            </div>
            <div id="checkerboard-checklist-container" class="grid grid-cols-2 gap-2"></div>
            <div id="charts-gallery-container" class="grid grid-cols-2 gap-2"></div>
            <textarea id="review-notes" oninput="saveNotes(this.value)" class="w-full p-2 border rounded text-xs" rows="3"></textarea>
        </aside>
    </div>

    <!-- Modals (Simplified for brevity) -->
    <div id="checklist-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-80">
            <h3 class="font-bold mb-4">Manage Rules</h3>
            <div id="active-rules-list"></div>
            <button onclick="closeChecklistModal()" class="mt-4 w-full bg-slate-800 text-white p-2">Close</button>
        </div>
    </div>

    <script>
        // Data Structures
        let monthsData = [{ name: "2026-07", initialAsset: 10000, trades: [] }];
        let activeMonthIndex = 0; let selectedTradeIndex = 0;
        let checklistRules = ["Entry Model", "Reasonable RR Ratio", "Order Type", "TP/SL Adjust"];
        let dropdownOptions = [{ label: "Confirmed", color: "green" }, { label: "Ignored", color: "pink" }, { label: "Not found", color: "gray" }];
        let lastDeletedChart = null;

        // Init App
        function renderAll() {
            renderJournal();
            renderCheckerboard();
            renderChartsGallery();
            renderNews();
        }

        // Logic for News
        function renderNews() {
            const news = [
                { title: "Crypto", summary: "Bitcoin hits support, institutional buying increases." },
                { title: "Stocks", summary: "Tech stocks rally on earnings reports." }
            ];
            const container = document.getElementById('news-container');
            container.innerHTML = news.map(n => `
                <div class="p-3 bg-slate-50 rounded-lg">
                    <div class="font-bold text-blue-600">${n.title}</div>
                    <p class="text-[10px] text-slate-600 mt-1">${n.summary}</p>
                </div>
            `).join('');
        }

        // Binder Click logic (Drawer open)
        function selectTrade(idx) {
            selectedTradeIndex = idx;
            renderCheckerboard();
            renderChartsGallery();
            document.getElementById('review-notes').value = monthsData[activeMonthIndex].trades[idx].notes || '';
        }

        // Checkerboard & Logic
        function renderCheckerboard() {
            const container = document.getElementById('checkerboard-checklist-container');
            container.innerHTML = '';
            const trade = monthsData[activeMonthIndex].trades[selectedTradeIndex];
            if(!trade) return;
            
            checklistRules.forEach(rule => {
                const val = trade.checklist[rule] || dropdownOptions[0].label;
                const opt = dropdownOptions.find(o => o.label === val);
                const bg = opt.color === 'green' ? 'status-green' : opt.color === 'pink' ? 'status-pink' : 'status-gray';
                
                container.innerHTML += `
                    <div class="p-2 border rounded ${bg}">
                        <div class="text-[9px] font-bold">${rule}</div>
                        <select onchange="updateChecklist('${rule}', this.value)" class="bg-white/50 w-full mt-1 text-[10px]">
                            ${dropdownOptions.map(o => `<option value="${o.label}" ${o.label === val ? 'selected' : ''}>${o.label}</option>`).join('')}
                        </select>
                    </div>
                `;
            });
        }

        function updateChecklist(rule, val) {
            monthsData[activeMonthIndex].trades[selectedTradeIndex].checklist[rule] = val;
            renderCheckerboard(); renderJournal();
        }

        // Gallery & Undo logic
        function renderChartsGallery() {
            const container = document.getElementById('charts-gallery-container');
            container.innerHTML = '';
            const trade = monthsData[activeMonthIndex].trades[selectedTradeIndex];
            if(!trade.charts) trade.charts = [];
            
            trade.charts.forEach((c, idx) => {
                container.innerHTML += `
                    <div class="bg-slate-100 p-2 rounded cursor-pointer" onclick="openPopup('${c.img}')">
                        <div class="text-[9px] font-bold" contenteditable onblur="updateChartTitle(${idx}, this.innerText)">${c.title}</div>
                        <img src="${c.img}" class="w-full h-16 object-cover mt-1">
                        <button onclick="event.stopPropagation(); deleteChart(${idx})" class="text-red-500 text-[8px]">Delete</button>
                    </div>
                `;
            });
        }

        function deleteChart(idx) {
            lastDeletedChart = { idx, data: monthsData[activeMonthIndex].trades[selectedTradeIndex].charts.splice(idx, 1)[0] };
            document.getElementById('undo-btn').classList.remove('hidden');
            renderChartsGallery();
        }

        function undoDelete() {
            const trade = monthsData[activeMonthIndex].trades[selectedTradeIndex];
            trade.charts.splice(lastDeletedChart.idx, 0, lastDeletedChart.data);
            document.getElementById('undo-btn').classList.add('hidden');
            renderChartsGallery();
        }

        // Table Rendering
        function renderJournal() {
            const tbody = document.getElementById('journal-tbody');
            tbody.innerHTML = monthsData[activeMonthIndex].trades.map((t, idx) => `
                <tr class="${t.pnl >= 0 ? 'row-profit' : 'row-loss'}" onclick="selectTrade(${idx})">
                    <td class="p-2 text-center font-bold">||</td>
                    <td class="p-2">${t.date}</td>
                    <td class="p-2">${t.pair}</td>
                    <td class="p-2 text-right">${t.pnl}</td>
                </tr>
            `).join('');
        }

        // Init
        function addNewTrade() {
            monthsData[activeMonthIndex].trades.unshift({ date: '2026-08-13', pair: 'BTC', pnl: 500, checklist: {}, charts: [], notes: '' });
            renderAll();
        }

        renderAll();
    </script>
</body>
</html>
